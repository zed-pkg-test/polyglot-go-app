[package]
org = "zedtest"
name = "polyglot-go-app"
version = "0.1.0"
description = "Consumes the golang slice of zedtest/polyglot-lib"
license = "MIT"

[package.repository]
vcs = "git"
url = "https://github.com/zed-pkg-test/polyglot-go-app"

# The same upstream repo as polyglot-node-app, a different package: one version,
# one source of truth, and this project downloads Go bytes only.
[dependencies]
"zedtest/polyglot-lib-golang" = "^0.1.0"

[install]
dir = ".vendor/.zed"
adapter = "go"
