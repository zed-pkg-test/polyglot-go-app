name: zed e2e (two-source Go consumer)

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ZED_CLI_REF: 7e5ac1897a872223f8316ef1c3342a2fa1982504
  ZED_INTERFACES_REF: 6e893ad0f28ccfbb7722f007d75e88548f1bcfdf
  POLYGLOT_REF: 998964aa58e49595547650b4a8da407b7a2283a9
  SHARED_SCHEMA_REF: 41cec5076791555d4b72e72da0a42888da0522d0

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: app
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: zed-pkg/zed-cli
          ref: ${{ env.ZED_CLI_REF }}
          path: zed-cli
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: zed-pkg/zed-interfaces
          ref: ${{ env.ZED_INTERFACES_REF }}
          path: zed-interfaces
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: zed-pkg-test/polyglot-lib
          ref: ${{ env.POLYGLOT_REF }}
          path: polyglot-lib
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: zed-pkg-test/shared-schema
          ref: ${{ env.SHARED_SCHEMA_REF }}
          path: shared-schema
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
      - uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed
        with:
          go-version: '1.22'
          cache: false
      - name: Build exact Zed CLI
        run: cargo build --locked --release --bin zed --manifest-path zed-cli/Cargo.toml
      - name: Configure hermetic registry
        run: |
          {
            echo "ZED=$GITHUB_WORKSPACE/zed-cli/target/release/zed"
            echo "ZED_PKG_REGISTRY=file://$RUNNER_TEMP/zed-reg"
            echo "ZED_PKG_HOME=$RUNNER_TEMP/zed-home"
          } >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/zed-reg" "$RUNNER_TEMP/zed-home"
      - name: Publish both immutable source repositories
        run: |
          set -euo pipefail
          (cd polyglot-lib && "$ZED" publish --skip-vcs-checks)
          (cd shared-schema && "$ZED" publish --skip-vcs-checks)
          test "$(find "$RUNNER_TEMP/zed-reg" -name '*.tar.gz' | wc -l)" -eq 5
      - name: Install both sources and run Go
        working-directory: app
        run: |
          set -euo pipefail
          "$ZED" install --install-mode copy
          go build ./...
          go run . | tee run.log
          grep -q 'polyglot-lib/go' run.log
          test -f .vendor/.zed/zedtest/polyglot-lib-golang/client.go
          test -f .vendor/.zed/zedtest/shared-schema/schemas/job-envelope.schema.json
          test -f .zed/go.work
          GOWORK="$PWD/.zed/go.work" go build ./...
          python3 - <<'PY'
          import json
          from pathlib import Path
          schema = json.loads(Path('.vendor/.zed/zedtest/shared-schema/schemas/job-envelope.schema.json').read_text())
          assert schema['title'] == 'JobEnvelope'
          paths = json.loads(Path('.zed/paths.json').read_text())
          names = {item['package'] for item in paths['packages']}
          assert {'zedtest/polyglot-lib-golang', 'zedtest/shared-schema'} <= names
          PY
      - name: Refuse the Node slice in a Go project
        working-directory: app
        run: |
          set -euo pipefail
          scratch="$RUNNER_TEMP/wrong-language"
          mkdir -p "$scratch"
          cp go.mod "$scratch/"
          sed 's/polyglot-lib-golang/polyglot-lib-nodejs/' .zpkg.toml > "$scratch/.zpkg.toml"
          cd "$scratch"
          if "$ZED" install > out.log 2>&1; then
            echo '::error::an npm package installed into a Go project' >&2
            exit 1
          fi
          grep -q 'npm' out.log
          grep -q 'gomod' out.log
          grep -q 'zedtest/polyglot-lib-golang' out.log
